# Used to set the user environment safely
# https://www.man7.org/linux/man-pages/man5/environment.d.5.html
# XDG standard: https://gist.github.com/roalcantara/107ba66dfa3b9d023ac9329e639bc58c

# offical xdg desktop standard
XDG_CONFIG_HOME=$HOME/.config
XDG_DATA_HOME=$HOME/.local/share
XDG_BIN_HOME=$HOME/.local/bin

# unofficial paths
LOCAL_SRC_HOME=$HOME/.local/src

