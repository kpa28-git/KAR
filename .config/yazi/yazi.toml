# yazi runtime config

[mgr]
sort_dir_first = true
linemode = "size"
show_symlink = true

[opener]
edit = [
	{ run = '$EDITOR %s', block = true, desc = "text editor" },
]
open = [
	{ run = 'xdg-open %s' },
]

[preview]
max_width = 2560
max_height = 1440
